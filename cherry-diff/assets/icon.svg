<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1e1e2e"/>

  <!-- Cherry stems - meet at top, curve down to each cherry -->
  <path d="M64 14 C64 22, 74 32, 80 48"
        stroke="#6a9955" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M64 14 C64 22, 54 32, 48 48"
        stroke="#6a9955" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Leaf - teardrop shape branching right from the stem junction -->
  <path d="M64 14 C68 8, 82 8, 84 16 C86 24, 72 22, 64 14 Z"
        fill="#6a9955"/>
  <!-- Leaf vein -->
  <path d="M66 14 C70 12, 78 13, 80 16"
        stroke="#1e1e2e" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- Left cherry (red = reject/deletion) -->
  <circle cx="46" cy="68" r="22" fill="#f44747"/>
  <circle cx="46" cy="68" r="22" fill="url(#cherryShineLeft)" opacity="0.4"/>
  <!-- Minus sign on left cherry -->
  <rect x="36" y="65" width="20" height="5" rx="2" fill="#1e1e2e"/>

  <!-- Right cherry (green = accept/addition) -->
  <circle cx="82" cy="68" r="22" fill="#6a9955"/>
  <circle cx="82" cy="68" r="22" fill="url(#cherryShineRight)" opacity="0.4"/>
  <!-- Plus sign on right cherry -->
  <rect x="72" y="65" width="20" height="5" rx="2" fill="#1e1e2e"/>
  <rect x="79.5" y="57.5" width="5" height="20" rx="2" fill="#1e1e2e"/>

  <!-- Diff lines at bottom — red right-aligned, green left-aligned -->
  <rect x="24" y="96" width="34" height="3" rx="1.5" fill="#f44747" opacity="0.6"/>
  <rect x="70" y="96" width="34" height="3" rx="1.5" fill="#6a9955" opacity="0.6"/>
  <rect x="32" y="103" width="26" height="3" rx="1.5" fill="#f44747" opacity="0.4"/>
  <rect x="70" y="103" width="26" height="3" rx="1.5" fill="#6a9955" opacity="0.4"/>

  <!-- Gradient definitions for cherry shine -->
  <defs>
    <radialGradient id="cherryShineLeft" cx="38%" cy="38%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="cherryShineRight" cx="38%" cy="38%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
